name: CI

# Every push to main and every pull request runs all checks; main also deploys to Cloudflare Pages.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: the workflow only reads the repository; deploys use the Cloudflare secret instead.
permissions:
  contents: read

# One run at a time per branch: a newer push waits for the running one, so an older deploy never lands
# after a newer one. GitHub keeps only the newest waiting run, so the last push is always what deploys.
concurrency: ci-${{ github.ref }}

jobs:
  build:
    runs-on: ubuntu-latest
    # Only the deploy steps get the Cloudflare secrets; the other steps see just whether they're set.
    env:
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Resized images (Astro) and finished share cards (src/lib/og.ts) from the last build, so this one
      # skips them; restored after `npm ci`, which empties node_modules. Not the content data store: it's
      # rebuilt each time.
      - name: Restore the image and share card caches
        uses: actions/cache@v6
        with:
          path: |
            node_modules/.astro/assets
            node_modules/.cache/og-cards
          key: build-cache-${{ runner.os }}-${{ github.sha }}
          restore-keys: build-cache-${{ runner.os }}-
      - name: Dependency advisories (fails on any not yet reviewed)
        run: node scripts/check-audit.mjs
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Nothing private in the deploy folder
        run: node scripts/check-dist.mjs dist
      # AC10 on mobile: performance >= 90, accessibility >= 95, best practices and SEO >= 90
      # (lighthouserc.json, which includes one published profile page).
      # Smoke tests in a real browser against dist/ served with the production headers (e2e/).
      - name: Browser smoke tests
        run: |
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Lighthouse budget
        run: npx --no-install lhci autorun
      # Deploys only from main, and only once Cloudflare secrets are configured.
      # The first deploy creates the Pages project if it doesn't exist yet (the token's "Pages: Edit"
      # permission allows it), then lists projects so the assigned *.pages.dev address shows in the log.
      - name: Create the Cloudflare Pages project if missing
        if: github.ref == 'refs/heads/main' && env.HAS_CLOUDFLARE == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if ! npx --no-install wrangler pages project list | grep -qw namesofukraine; then
            npx --no-install wrangler pages project create namesofukraine --production-branch=main
          fi
          npx --no-install wrangler pages project list
      - name: Deploy to Cloudflare Pages
        if: github.ref == 'refs/heads/main' && env.HAS_CLOUDFLARE == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --no-install wrangler pages deploy dist --project-name=namesofukraine --branch=main
