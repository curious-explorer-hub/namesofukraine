name: Check tokens

# Every Monday, checks that the Threads, Instagram and Cloudflare tokens still work and don't expire within
# 10 days (scripts/check-tokens.mjs), and emails the owner the report, the same way as the feedback digest;
# sending it also proves the Gmail app password still works. If anything needs attention the run fails, so
# GitHub's failure email is a second warning. The run's Summary page shows the same table of every secret
# with its expiry date. The log shows only names, states and dates.
on:
  schedule:
    - cron: '0 6 * * 1' # Mondays, an hour before the digest
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check the tokens
        id: tokens
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}
          CLOUDFLARE_D1_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if node scripts/check-tokens.mjs > "$RUNNER_TEMP/tokens.md"; then echo "attention=false" >> "$GITHUB_OUTPUT"; else echo "attention=true" >> "$GITHUB_OUTPUT"; fi
          cat "$RUNNER_TEMP/tokens.md"
      # The Gmail row is added after sending, and the summary is written once: GitHub shows each step's summary
      # as a separate block, so a row written by another step would fall outside the table.
      - name: Email the report
        env:
          ATTENTION: ${{ steps.tokens.outputs.attention }}
          MAIL_USER: ${{ secrets.FEEDBACK_MAIL_USER }}
          MAIL_PASSWORD: ${{ secrets.FEEDBACK_MAIL_PASSWORD }}
          MAIL_TO: ${{ secrets.FEEDBACK_MAIL_TO }}
        run: |
          report="$RUNNER_TEMP/tokens.md"
          subject=$([ "$ATTENTION" = "true" ] && echo 'Tokens need attention' || echo 'Tokens OK')
          {
            printf 'From: Know Your Own <%s>\r\nTo: %s\r\nSubject: %s\r\n' "$MAIL_USER" "$MAIL_TO" "$subject"
            printf 'Content-Type: text/plain; charset=utf-8\r\nContent-Transfer-Encoding: 8bit\r\n\r\n'
            cat "$report"
          } > "$RUNNER_TEMP/mail.txt"
          if curl --silent --show-error --ssl-reqd --url 'smtps://smtp.gmail.com:465' \
            --user "$MAIL_USER:${MAIL_PASSWORD// /}" --mail-from "$MAIL_USER" --mail-rcpt "$MAIL_TO" \
            --upload-file "$RUNNER_TEMP/mail.txt"; then
            sent=true
            echo '| FEEDBACK_MAIL_PASSWORD | ✅ ok (sent this report) | no expiry | - | |' >> "$report"
          else
            sent=false
            echo '| FEEDBACK_MAIL_PASSWORD | ⚠️ sending failed | - | - | create a new Gmail app password and update the secret |' >> "$report"
          fi
          cat "$report" >> "$GITHUB_STEP_SUMMARY"
          [ "$sent" = true ] && echo "Sent the report: $subject." || exit 1
      - name: Fail when a token needs attention
        if: steps.tokens.outputs.attention == 'true'
        run: exit 1
