# Weekly dependency update PRs (backlog item 11). Takes effect once the repo is on an account with
# Dependabot enabled (see product_vision.md §11, L2).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      astro:
        patterns: ['astro', '@astrojs/*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
